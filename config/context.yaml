# Контекстные маркеры для отличия персональных данных от публичных сведений.
# Регулярные выражения, регистр не учитывается. Правится без изменения кода.

# Рядом с ФИО: речь о публичной персоне, а не о клиенте
public_person_markers:
  - "поэт\\w*"
  - "писател\\w*"
  - "прозаик\\w*"
  - "драматург\\w*"
  - "композитор\\w*"
  - "художни\\w+"
  - "скульптор\\w*"
  - "актёр\\w*|актер\\w*|актрис\\w+"
  - "режисс\\w+"
  - "музыкант\\w*|певец|певиц\\w+"
  - "учён\\w+|учен\\w+|физик\\w*|химик\\w*|математик\\w*"
  - "космонавт\\w*"
  - "полководц\\w+|полководец|маршал\\w*|генерал\\w*"
  - "император\\w*|царь|царица|цар[яеию]|княз\\w+|княгин\\w+"
  - "президент\\w*|премьер\\w*|министр\\w*|губернатор\\w*|мэр\\w*|депутат\\w*"
  - "философ\\w*|историк\\w*"
  - "автор\\w*|классик\\w*"
  - "роман\\w*|повест\\w+|поэм\\w+|стих\\w+|произведени\\w+|пьес\\w+|симфони\\w+|картин\\w+"
  - "памятник\\w*|бюст\\w*|музе\\w+|театр\\w*|библиотек\\w+|нобелевск\\w+|оскар\\w*"
  - "фильм\\w*|кинофильм\\w*|сериал\\w*|мультфильм\\w*|книг[аеиуой]\\b|песн[яиюей]\\b|спектакл\\w*|опер[аыуе]\\b|балет\\w*|альбом\\w*"
  - "улиц\\w+\\s+(?:имени\\s+)?|площад\\w+\\s+(?:имени\\s+)?|проспект\\w*\\s+(?:имени\\s+)?|станци\\w+\\s+метро|(?<!по\\s)(?<!от\\s)\\bимени"
  - "родился\\s+в\\s+\\d{4}|умер\\s+в\\s+\\d{4}|годы\\s+жизни|\\(\\d{4}\\s*[-–]\\s*\\d{4}\\)"
  - "великий|великого|знаменит\\w+|известн\\w+|легендарн\\w+"
  - "футболист\\w*|хоккеист\\w*|спортсмен\\w*|чемпион\\w*|олимпийск\\w+"

# Рядом с ФИО или адресом: речь о конкретном человеке-клиенте
personal_markers:
  - "клиент\\w*"
  - "заёмщик\\w*|заемщик\\w*|созаёмщик\\w*|поручител\\w+"
  - "заявител\\w+|получател\\w+|отправител\\w+|плательщик\\w*|вкладчик\\w*|держател\\w+"
  - "пациент\\w*|абонент\\w*|пользовател\\w+|сотрудник\\w*|работник\\w*|гражданин\\w*|гражданк\\w+"
  - "паспорт\\w*|снилс|дата\\s+рождения|д\\.\\s*р\\.|г\\.\\s*р\\."
  - "проживает|проживающ\\w+|зарегистрирован\\w*|прописан\\w*|адрес\\s+(?:регистрации|проживания|прописки|доставки)"
  - "телефон\\w*|тел\\.|e-?mail|почт\\w+"
  - "ф\\.?\\s*и\\.?\\s*о\\.?|фио|фамили\\w+|имя|отчеств\\w+"
  - "договор\\w*|счёт\\w*|счет\\w*|\\bкарт(?:а|ы|е|у|ой|ам|ами|ах|очк\\w*)?\\b|кредит\\w*|заявк\\w+|анкет\\w+|доверенност\\w+"
  - "уважаем\\w+|г-н|г-жа|господин\\w*|госпож\\w+|гр\\."
  - "меня\\s+зовут|зовут|представьтесь|на\\s+имя"

# Рядом с адресом: адрес организации, не человека
org_markers:
  # Только существительные с явными окончаниями и границей слова: «ул. Школьная», «Парковая»,
  # «Банковский пер.» - это названия улиц, а не признак адреса организации
  - "\\bотделени(?:е|я|ю|ем|и|й|ям|ях)\\b"
  - "\\bофис(?:а|е|у|ом|ы|ов|ам|ах)?\\b"
  - "\\bфилиал(?:а|е|у|ом|ы|ов|ам|ах)?\\b"
  - "\\bбанк(?:а|е|у|ом|и|ов|ам|ах)?\\b"
  - "\\bпао\\b|\\bао\\b|\\bооо\\b|\\bзао\\b|\\bоао\\b|\\bип\\b|\\bнко\\b|\\bгуп\\b|\\bмуп\\b|\\bфгуп\\b"
  - "\\bмагазин(?:а|е|у|ом|ы|ов)?\\b|\\bторгов\\w+\\s+(?:центр|точк)\\w*|\\bтц\\b|\\bтрц\\b"
  - "\\bкомпани(?:я|и|ю|ей)\\b|\\bорганизаци(?:я|и|ю|ей)\\b|\\bпредприяти(?:е|я|ю|ем|и)\\b|\\bучреждени(?:е|я|ю|ем|и)\\b|\\bфирм(?:а|ы|е|у|ой)\\b|\\bкорпораци(?:я|и|ю|ей)\\b"
  - "юридическ\\w+\\s+адрес\\w*|фактическ\\w+\\s+адрес\\w*|почтов\\w+\\s+адрес\\s+(?:банка|компании|организации)"
  - "головн\\w+\\s+офис\\w*|штаб-квартир\\w+|центральн\\w+\\s+офис\\w*"
  - "пункт\\w*\\s+выдачи|\\bпвз\\b|\\bкасс(?:а|ы|е|у|ой)\\b|\\bбанкомат(?:а|е|у|ом|ы|ов)?\\b|\\bтерминал(?:а|е|у|ом|ы|ов)?\\b"
  - "\\bшкол(?:а|ы|е|у|ой)\\b|\\bуниверситет(?:а|е|у|ом)?\\b|\\bинститут(?:а|е|у|ом)?\\b|\\bбольниц(?:а|ы|е|у|ей)\\b|\\bполиклиник(?:а|и|е|у|ой)\\b|\\bмфц\\b|налогов\\w+\\s+(?:инспекци|служб)\\w*|\\bсуд(?:а|е|у|ом)?\\b|\\bадминистраци(?:я|и|ю|ей)\\b"
  - "\\bмуз(?:ей|ея|ее|ею|еем)\\b|\\bтеатр(?:а|е|у|ом)?\\b|\\bстадион(?:а|е|у|ом)?\\b|\\bвокзал(?:а|е|у|ом)?\\b|\\bаэропорт(?:а|е|у|ом)?\\b|\\bметро\\b"
  - "\\bифнс\\b|\\bфнс\\b|\\bинспекци(?:я|и|ю|ей)\\b|\\bпрокуратур\\w+|\\bотдел\\w*\\s+полиции|\\bомвд\\b|\\bгибдд\\b|\\bзагс\\w*"
  - "\\bнаходится\\b|\\bрасположен\\w*|работает\\s+по\\s+адресу|принимает\\s+по\\s+адресу"
  - "\\bbranch\\w*|\\boffice\\b|\\bbank\\b|\\bheadquarters\\b|\\batm\\b|флагманск\\w+|открыл(?:ся|ось|ась)"

# Слово перед одиночным именем или фамилией, которое делает его персональными данными
person_triggers:
  - "ф\\.?\\s*и\\.?\\s*о\\.?|фио"
  - "клиент\\w*|заёмщик\\w*|заемщик\\w*|заявител\\w+|получател\\w+|отправител\\w+|плательщик\\w*"
  - "пациент\\w*|абонент\\w*|пользовател\\w+|сотрудник\\w*|работник\\w*|гражданин\\w*|гражданк\\w+"
  - "имя|фамили\\w+|отчеств\\w+"
  - "уважаем\\w+|г-н|г-жа|господин\\w*|госпож\\w+|гр\\.|товарищ\\w*"
  - "меня\\s+зовут|зовут|на\\s+имя|от\\s+имени|по\\s+имени|представился|представилась"
  - "my\\s+name\\s+is|full\\s+name|name\\s*:|\\bclient\\s*:|\\bcustomer\\s*:|\\bborrower\\s*:|\\bmr\\.?|\\bmrs\\.?|\\bms\\.?|\\bdear\\b|\\bfrom\\s*:|signed\\s*,?"
  - "держател\\w+|владелец|владелиц\\w+|собственник\\w*"
  - "контакт\\w*|менеджер\\w*|оператор\\w*|специалист\\w*|курьер\\w*|водител\\w+"
  - "заказчик\\w*|покупател\\w+|продавец|продавц\\w+|арендатор\\w*|арендодател\\w+|наниматель|наймодател\\w+"
  - "истец|истц\\w+|ответчик\\w*|свидетел\\w+|подозреваем\\w+|обвиняем\\w+|потерпевш\\w+"
  - "муж|жена|сын|дочь|отец|мать|брат|сестра|супруг\\w*|родител\\w+|ребёнок|ребенок|семь[яиюей]\\b|внук\\w*|внучк\\w*"
  - "звонил\\w*|позвонил\\w*|обратил\\w*|написал\\w*|сообщил\\w*|попросил\\w*|приходил\\w*|пришёл|пришла|передал\\w*|подписал\\w*|оформил\\w*|получил\\w*|отправил\\w*"
  - "ответственн\\w+|исполнител\\w+|подписант\\w*|представител\\w+|уполномоченн\\w+|доверенн\\w+\\s+лиц\\w+"

# Рядом с латинским именем: речь о карте
card_context:
  - "карт\\w+|card|cardholder|держател\\w+|владел\\w+|visa|mastercard|мир|maestro|\\bpan\\b|эмбоссир\\w+"