# Негативный контекст ищется в строке «окно_до \x02 значение \x03 окно_после»:
# \x02 отмечает начало значения, поэтому «\bдо\s*\x02» значит «слово «до» прямо перед датой».
type: BIRTH_DATE
label_ru: ДАТА_РОЖДЕНИЯ
label_en: BIRTH_DATE
rules:
  - id: birth_ctx_before
    requires_any: ["рожд", "д.р", "д. р", "родил", "dob", "birth", "born"]
    pattern: "(?:дат[аыуе]\\s+рождени[яе]|д\\.?\\s*р\\.?(?![\\p{L}])|родил(?:ся|ась|ись|а|и)?|рожд[её]н\\p{L}*|дата\\s+рожд\\.?|date\\s+of\\s+birth|\\bdob\\b|birthday|\\bborn\\b|день\\s+рождения|дата\\s+рождения\\s+ребёнка){LT}(?:\\s+прописью)?{SEP}(?:в\\s+|—\\s*)?(?P<v>{DATE}){YEAR_SUFFIX}"
    confidence: 0.99
    priority: 135
    validators: [date_any, plausible_birth]
  - id: birth_ctx_after
    requires_any: ["рожд", "р.", "г.р", "г. р"]
    pattern: "(?P<v>{DATE})\\s*(?:г\\.?|года)?\\s*(?:рождения|р\\.|г\\.\\s*р\\.|г\\.р\\.|года\\s+рождения|р\\.\\s*$)"
    confidence: 0.99
    priority: 135
    validators: [date_any, plausible_birth]
  # «Поздравляем с днём рождения, 25 сентября»: день и месяц без года тоже дата рождения
  - id: birthday_day_month
    requires_any: ["рожден"]
    pattern: "(?:дн[её]м|день|дня)\\s+рождени[яе][\\s,:\\-–—]*(?P<v>\\d{1,2}\\s+{MONTH})(?![\\p{L}]|\\s*\\d)"
    confidence: 0.9
    priority: 133
  - id: birth_year_only
    min_digits: 4
    requires_any: ["рожд", "г.р", "г. р"]
    pattern: "(?<![\\d.])(?P<v>\\d{4})\\s*(?:г\\.\\s*р\\.|г\\.р\\.|года\\s+рождения|г\\.\\s+рождения|год\\s+рождения)"
    confidence: 0.95
    priority: 125
  - id: birth_year_in
    min_digits: 4
    requires_any: ["родил", "рожд"]
    pattern: "(?:родил(?:ся|ась|ись)|рожд[её]н\\p{L}*)\\s+в\\s+(?P<v>\\d{4})\\s+(?:году|г\\.)"
    confidence: 0.93
    priority: 124
    validators: [plausible_birth]
  - id: date_bare_numeric
    min_digits: 4
    pattern: "(?<![\\d./\\-])(?P<v>{NUM_DATE})(?![\\d./\\-])"
    confidence: 0.6
    priority: 40
    policy: bare_date
    validators: [date_any, birth_like]
    negative_context: ["договор\\p{L}*", "заказ\\p{L}*", "сч[её]т\\p{L}*", "плат[её]ж\\p{L}*|оплат\\p{L}+", "встреч\\p{L}+", "срок\\p{L}*", "\\b(?:до|с|от|по|на)\\s*\\x02", "выдан\\p{L}*", "дата\\s+(?:заключения|платежа|операции|выдачи|поступления|отправки|доставки|подписания|регистрации|открытия|закрытия)", "действител\\p{L}+|действует|истекает", "верси\\p{L}+|релиз\\p{L}*|обновлени\\p{L}+", "сегодня|вчера|завтра", "период\\p{L}*|отч[её]т\\p{L}*", "\\x03\\s*[TТ]?\\d{1,2}:\\d{2}"]
    negative_window: 30
  - id: date_bare_text
    requires_any: ["январ", "феврал", "март", "апрел", "мая", "май", "июн", "июл", "август", "сентябр", "октябр", "ноябр", "декабр", "янв", "фев", "мар", "апр", "авг", "сен", "окт", "ноя", "дек"]
    pattern: "(?<![\\d])(?P<v>{TEXT_DATE}){END}"
    confidence: 0.6
    priority: 40
    policy: bare_date
    validators: [birth_like]
    negative_context: ["договор\\p{L}*", "заказ\\p{L}*", "сч[её]т\\p{L}*", "плат[её]ж\\p{L}*|оплат\\p{L}+", "встреч\\p{L}+", "срок\\p{L}*", "\\b(?:до|с|от|по|на)\\s*\\x02", "выдан\\p{L}*", "действител\\p{L}+|действует|истекает", "сегодня|вчера|завтра", "в\\s+честь|парад\\p{L}*|побед\\p{L}*|битв\\p{L}*|сражени\\p{L}*|годовщин\\p{L}*|юбиле\\p{L}*|полет\\p{L}*|космос\\p{L}*|основан\\p{L}*|открыт\\p{L}*|начал\\p{L}*|закончил\\p{L}*|подписан\\p{L}*|произош\\p{L}*|вышел|вышла|выпущен\\p{L}*|войн\\p{L}*|революци\\p{L}*"]
    negative_window: 40