rules:
  - id: cvv_ctx
    min_digits: 3
    requires_any: ["cvv", "cvc", "cvp", "cid", "код", "цифр"]
    pattern: "(?:\\bcvv2?|\\bcvc2?|\\bcvp2?|\\bcid\\b|код\\p{L}*\\s+безопасности|защитн\\p{L}+\\s+код\\p{L}*|проверочн\\p{L}+\\s+код\\p{L}*|три\\s+цифры\\s+(?:на\\s+обороте|с\\s+обратной\\s+стороны)|код\\p{L}*\\s+на\\s+обороте(?:\\s+карты)?|секретн\\p{L}+\\s+код\\p{L}*\\s+карты|(?:секретн\\p{L}+\\s+)?код\\p{L}*\\s+с\\s+(?:обратной|оборотной)\\s+стороны(?:\\s+карты)?)(?:\\s*/\\s*(?:cvc2?|cvv2?))?(?:\\s+(?:код|карты))?(?:(?:(?!пин|pin)[^\\d\\n.;]){0,20}?(?P<v>\\d{3,4}){END}){1,2}"
    confidence: 0.99
    priority: 135
  - id: cvv_after
    min_digits: 3
    requires_any: ["cvv", "cvc", "код", "цифр"]
    pattern: "(?<![\\d\\-+./])(?P<v>\\d{3,4})\\s*(?:[—–\\-:]\\s*)?(?:это\\s+)?(?:мой\\s+|мои\\s+)?(?:cvv2?|cvc2?|код\\p{L}*\\s+безопасности|три\\s+цифры\\s+на\\s+обороте)(?![\\p{L}])"
    confidence: 0.95
    priority: 130
  # «Код CVV2 с карты 4557 0135 5768 6674: 907» - между меткой и значением стоит номер карты
  - id: cvv_after_card
    min_digits: 16
    requires_any: ["cvv", "cvc", "код"]
    pattern: "(?:\\bcvv2?|\\bcvc2?|код\\p{L}*\\s+безопасности)[^\\d\\n]{0,20}?\\d{4}(?:[ \\-]?\\d{4}){2,3}\\d{0,3}\\s*[:\\-–—]\\s*(?P<v>\\d{3,4}){END}"
    confidence: 0.97
