# Макросы подставляются в паттерны правил как {ИМЯ}. Порядок важен: макрос может ссылаться на предыдущие.

# Разделитель между меткой и значением: двоеточие, №, тире, кавычки JSON («"СНИЛС": "...»)
SEP: "\\s*[\"'»]?\\s*[:№#=\\-–—]?\\s*[\"'«]?\\s*"
# Уточнение после метки: «ИНН клиента - ...», «паспорт заёмщика: ...»
LT: "(?:\\s+(?:клиента|клиентки|заёмщика|заемщика|получателя|отправителя|владельца|держателя|гражданина|гражданки|заявителя|пациента|сотрудника|абонента|физ\\.?\\s*лица|физлица|мой|моя|моё|мое|его|её|ее|у\\s+клиента))?"
# Конец числового значения: не цифра и не продолжение числа («.5»), точка в конце предложения допустима
END: "(?![\\d]|[\\-/.,]\\d)"
MONTH: "(?:январ[ьяе]|феврал[ьяе]|март[ае]?|апрел[ьяе]|ма[йяе]|июн[ьяе]|июл[ьяе]|август[ае]?|сентябр[ьяе]|октябр[ьяе]|ноябр[ьяе]|декабр[ьяе]|янв|фев|мар|апр|июн|июл|авг|сен|сент|окт|ноя|дек)\\.?"
DAY_WORD: "(?:перв\\p{L}+|втор\\p{L}+|треть\\p{L}+|четв[её]рт\\p{L}+|пят\\p{L}+|шест\\p{L}+|седьм\\p{L}+|восьм\\p{L}+|девят\\p{L}+|десят\\p{L}+|одиннадцат\\p{L}+|двенадцат\\p{L}+|тринадцат\\p{L}+|четырнадцат\\p{L}+|пятнадцат\\p{L}+|шестнадцат\\p{L}+|семнадцат\\p{L}+|восемнадцат\\p{L}+|девятнадцат\\p{L}+|двадцат\\p{L}+(?:\\s+(?:перв|втор|треть|четв[её]рт|пят|шест|седьм|восьм|девят)\\p{L}+)?|тридцат\\p{L}+(?:\\s+перв\\p{L}+)?)"
# Год прописью: «тысяча девятьсот девяностого», «восемьдесят седьмого», «две тысячи пятого»
NUM_WORD: "(?:одна|одной|тысяч\\p{L}*|девятьсот|две|двух|двухтысячн\\p{L}+|двадцат\\p{L}*|тридцат\\p{L}*|сорок\\p{L}*|пятидесят\\p{L}*|пятьдесят|шестидесят\\p{L}*|шестьдесят|семидесят\\p{L}*|семьдесят|восьмидесят\\p{L}*|восемьдесят|девяност\\p{L}*|девяносто|перв\\p{L}+|втор\\p{L}+|трет\\p{L}+|четв[её]рт\\p{L}+|пят\\p{L}+|шест\\p{L}+|седьм\\p{L}+|восьм\\p{L}+|девят\\p{L}+|десят\\p{L}+|одиннадцат\\p{L}+|двенадцат\\p{L}+|тринадцат\\p{L}+|четырнадцат\\p{L}+|пятнадцат\\p{L}+|шестнадцат\\p{L}+|семнадцат\\p{L}+|восемнадцат\\p{L}+|девятнадцат\\p{L}+)"
YEAR_WORDS: "(?:{NUM_WORD}(?:\\s+{NUM_WORD}){0,4})"
NUM_DATE: "(?:\\d{1,2}(?:[./\\-]|\\.[ \\t])\\d{1,2}(?:[./\\-]|\\.[ \\t])(?:\\d{4}|\\d{2})|\\d{4}[./\\-]\\d{1,2}[./\\-]\\d{1,2})"
TEXT_DATE: "(?:\\d{1,2}|{DAY_WORD})\\s+{MONTH}\\s+(?:\\d{4}|{YEAR_WORDS})"
DATE: "(?:{NUM_DATE}|{TEXT_DATE})"
YEAR_SUFFIX: "(?:\\s*г(?:ода|\\.)?)?"
WORD: "\\p{L}[\\p{L}'’\\-]{1,40}"
# Заглавная буква даже под IGNORECASE
U: "(?-i:\\p{Lu})"
CAP: "{U}[\\p{L}'’\\-]{1,40}"
# Сокращения населённых пунктов: только строчные, чтобы «И. П. Сидоров» не стал посёлком
# Второе слово названия города не может быть типом региона: «Ташкент Республики Узбекистан»
NOT_REGION: "(?!(?:республик|област|кра[йяею]|округ|район|ссср|сср)\\p{L}*(?![\\p{L}]))"
# «2012 г.» после числа означает год, а не город
ABBR_CITY: "(?-i:(?<!\\d[ \\t]?)\\b(?:г|гор|с|д|п|ст|пос|дер|рп|пгт|снт|х)\\.)"
# Тип улицы целым словом в любом падеже
STREET_TYPE: "(?:ул\\.|улиц[аеуы]|пр-т|пр-кт|пр\\.|просп\\.|проспект[ауе]?|пер\\.|переул(?:ок|ке|ка)|б-р|бульвар[ауе]?|ш\\.|шоссе|наб\\.|набережн(?:ая|ой|ую)|пл\\.|площад[ьи]|пр-д|проезд[ауе]?|тупик[ауе]?|алле[яиюе]|мкр\\.?|микрорайон[ауе]?|кв-л|квартал[ауе]?|тракт[ауе]?)(?![\\p{L}])"