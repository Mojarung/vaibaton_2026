type: PIN
label_ru: ПИН_КОД
label_en: PIN
rules:
  # После упоминания PIN до трёх чисел в том же предложении: «PIN то ли 1357, то ли 7531»,
  # «новый ПИН 2468, старый 8642». Номер карты рядом длиннее и побеждает при пересечении.
  - id: pin_ctx
    min_digits: 4
    requires_any: ["пин", "pin"]
    pattern: "(?:пин[\\s\\-]?код\\p{L}*|\\bпин\\b|\\bpin(?:[\\s\\-]?(?:code|код))?\\b|пинкод\\p{L}*)(?:(?:(?!cvv|cvc|код\\p{L}*\\s+безопасности)[^\\d\\n.;]){0,30}?(?P<v>\\d{4,6}){END}){1,3}"
    confidence: 0.99
    priority: 135
  # «пароль от карты 5812»: в разговорной речи так называют PIN
  - id: pin_password
    min_digits: 4
    requires_any: ["пароль"]
    pattern: "пароль\\s+(?:от|к|для)\\s+(?:моей\\s+|банковской\\s+)?карт\\p{L}*{SEP}(?P<v>\\d{4,6}){END}"
    confidence: 0.95
    priority: 134
  - id: pin_after
    min_digits: 4
    requires_any: ["пин", "pin"]
    pattern: "(?<![\\d\\-+./])(?P<v>\\d{4,6})\\s*(?:[—–\\-:]\\s*)?(?:это\\s+)?(?:мой\\s+)?(?:пин[\\s\\-]?код\\p{L}*|\\bпин\\b|\\bpin\\b)"
    confidence: 0.95
    priority: 130