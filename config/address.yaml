# Триггеры цепочек адреса и места рождения. После триггера движок разбирает
# окно до конца записи и маскирует значения компонентов, оставляя служебные слова.

address_triggers:
  - "адрес\\p{L}*(?:\\s+(?:регистрации|проживания|прописки|доставки|места\\s+жительства|фактическ\\p{L}+|постоянн\\p{L}+|временн\\p{L}+|получателя|отправителя))?"
  - "проживает|проживающ\\p{L}+|проживаю|проживаем"
  - "зарегистрирован\\p{L}*|прописан\\p{L}*"
  - "живу|живёт|живет|живём|живем"
  - "доставить\\s+(?:по\\s+адресу|на\\s+адрес)|доставка\\s+(?:по\\s+адресу|на\\s+адрес)|отправить\\s+(?:по\\s+адресу|на\\s+адрес)"
  - "по\\s+адресу"
  - "место\\s+жительства|местожительств\\p{L}*"

birthplace_triggers:
  - "место\\s+рождения|место\\s+рожд\\.|г\\.\\s*рожд\\.|город\\s+рождения|м\\.\\s*р\\."
  - "родил(?:ся|ась|ись)\\s+в"
  # «Родилась 2 января 2001 г. в Казани»: дата между глаголом и местом
  - "родил(?:ся|ась|ись)\\s+[^\\n;]{3,30}?\\s+в(?=\\s+(?-i:\\p{Lu}))"
  - "родом\\s+из"
  - "уроженец|уроженка"
  - "place\\s+of\\s+birth|born\\s+in"

