/* ---------- engine ---------- */
const clock = () => performance.now() / 1000;
let cur = 0, tStart = clock(), trans = null, hits = [];
function go(i) {
  i = clamp(i, 0, S.length - 1) | 0;
  if (i === cur) return;
  const now = clock();
  trans = { from: cur, fromT: Math.min(now - tStart, S[cur].dur + 2), start: now, fromPlate: S[cur].plate };
  cur = i; tStart = now; UI.sys = null; UI.fail = null;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) { /* file:// */ }
}
function ui(st, t) {
  const s = S[cur];
  const col = PLATE_STYLE[s.plate].ui;
  const pr = clamp(t / s.dur);
  ctx.save();
  ctx.fillStyle = rgba(col, 0.2); ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = rgba(s.plate === 'red' ? P.white : P.red, 0.95); ctx.fillRect(0, H - 6, W * pr, 6);
  setFont(22, 700, MONO); ctx.fillStyle = rgba(col, 0.75); ctx.textAlign = 'right';
  ctx.fillText(String(cur + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0'), W - 64, 88);
  const btn = (x, dir, id) => {
    const hov = UI.hover === id;
    ctx.beginPath(); ctx.arc(x, 1024, 26, 0, Math.PI * 2);
    ctx.fillStyle = rgba(col, hov ? 0.28 : 0.12); ctx.fill();
    ctx.strokeStyle = rgba(col, 0.8); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 5 * dir, 1014); ctx.lineTo(x + 5 * dir, 1024); ctx.lineTo(x - 5 * dir, 1034); ctx.stroke();
    hits.push({ id, x: x - 26, y: 998, w: 52, h: 52 });
  };
  btn(W - 142, -1, 'prev'); btn(W - 76, 1, 'next');
  if (cur === 0 && !trans) {
    const a = clamp((7 - t) / 1.5) * clamp(t / 0.8);
    setFont(20, 600); ctx.textAlign = 'center'; ctx.fillStyle = rgba(P.white, 0.85 * a);
    ctx.fillText('← → листать · R повторить слайд · F полный экран', W / 2, 1050);
  }
  ctx.restore();
}
let fpsAcc = 0, fpsN = 0, fps = 0, showFps = false;
let lastNow = clock();
function frame() {
  const now = clock();
  fpsAcc += now - lastNow; fpsN++; lastNow = now;
  if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  TIME = now;
  const s = S[cur];
  const t = now - tStart;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  let actors;
  hits = [];
  if (trans) {
    const tp = clamp((now - trans.start) / TRANS);
    drawPlates(now, trans.fromPlate, s.plate, tp, s.tr);
    const A = S[trans.from].scene(trans.fromT, now);
    const B = s.scene(t, now);
    actors = morph(A, B, tp);
    if (tp >= 1) trans = null;
  } else {
    drawPlates(now, s.plate, s.plate, 0);
    actors = s.scene(t, now);
    for (const a of actors) if (a.hit) hits.push({ id: a.hit, x: a.x, y: a.y, w: a.w, h: a.h });
  }
  render(actors);
  ui(PLATE_STYLE[s.plate], t);
  if (showFps) { setFont(18, 700, MONO); ctx.fillStyle = '#0f0'; ctx.textAlign = 'left'; ctx.fillText(fps.toFixed(0) + ' fps', 60, 60); }
  requestAnimationFrame(frame);
}
function toVirtual(e) { return [(e.clientX - ox) / sc, (e.clientY - oy) / sc]; }
function hitAt(e) {
  const [x, y] = toVirtual(e);
  for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h.id; }
  return null;
}
cv.addEventListener('mousemove', e => { UI.hover = hitAt(e); cv.style.cursor = UI.hover ? 'pointer' : 'default'; });
cv.addEventListener('click', e => {
  const id = hitAt(e);
  if (!id) return;
  if (id === 'next') go(cur + 1);
  else if (id === 'prev') go(cur - 1);
  else if (id.startsWith('sys:')) { UI.sys = +id.slice(4); UI.sysAt = clock(); }
  else if (id.startsWith('fail:')) { UI.fail = +id.slice(5); UI.failAt = clock(); }
});
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(S.length - 1);
  else if (e.key === 'r' || e.key === 'к') { tStart = clock(); UI.sys = null; UI.fail = null; }
  else if (e.key === 'f' || e.key === 'а') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 'p' || e.key === 'з') showFps = !showFps;
  else if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
});
const start = parseInt((location.hash || '').slice(1), 10);
const fontsReady = Promise.all([400, 500, 600, 650, 700, 750, 800, 900].map(w =>
  document.fonts.load(`${w} 40px Inter`, 'АаZz09'))).catch(() => null);
fontsReady.then(() => {
  if (start >= 1 && start <= S.length) cur = start - 1;
  tStart = clock();
  requestAnimationFrame(frame);
});
